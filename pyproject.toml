[project]
name = "framestar"
version = "0.1.0"
description = "WeatherStar-flavoured kiosk slideshow for a hacked photo frame"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "icalendar>=6.1",
    "pillow>=11",
    "pydantic>=2.9",
    "pyyaml>=6",
    "recurring-ical-events>=3.4",
    "tzdata>=2025.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
]

[project.scripts]
framestar = "framestar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
