<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Framestar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <header id="chrome-header">
      <div class="title-bar">
        <div class="title" id="title-1"></div>
        <div class="title" id="title-2"></div>
      </div>
      <div class="clock">
        <div id="clock-time"></div>
        <div id="clock-date"></div>
      </div>
    </header>
    <div id="slides"></div>
    <footer id="chrome-crawl"><div class="crawl-text" id="crawl-text"></div></footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
